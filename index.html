<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="msg">Loading video…</div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var videoId = params.get("v");
      var msg = document.getElementById("msg");

      if (!videoId || !/^[a-zA-Z0-9_-]{6,20}$/.test(videoId)) {
        msg.textContent = "No valid video ID provided. Open this page as ?v=VIDEO_ID.";
        return;
      }

      // A genuine top-level navigation (not an iframe) — this is what
      // reliably loads for real, matching how a plain clicked link
      // behaves. The Referer sent on this navigation is this page's
      // own URL, satisfying YouTube's embed requirement.
      window.location.replace("https://www.youtube.com/embed/" + encodeURIComponent(videoId));
    })();
  </script>
</body>
</html>
